apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "backend.fullname" . }}-externalsecret
  namespace: {{ .Values.global.environment }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.aws.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ include "backend.fullname" . }}-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: MYSQL_USER
      remoteRef:
        key: {{ .Values.aws.secretName }}
        property: username
    - secretKey: MYSQL_PASSWORD
      remoteRef:
        key: {{ .Values.aws.secretName }}
        property: password