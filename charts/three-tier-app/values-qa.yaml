global:
  environment: qa

frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: 231733667519.dkr.ecr.eu-west-1.amazonaws.com/poc2-three-tier-frontend
    tag: "v2"
    pullPolicy: IfNotPresent
  service:
    port: 80
    targetPort: 80
  resources:
    requests:
      cpu: "150m"
      memory: "192Mi"
    limits:
      cpu: "300m"
      memory: "384Mi"

backend:
  enabled: true
  replicaCount: 1
  image:
    repository: 231733667519.dkr.ecr.eu-west-1.amazonaws.com/poc2-three-tier-backend
    tag: "v1"
    pullPolicy: IfNotPresent
  service:
    port: 80
    targetPort: 4000
  resources:
    requests:
      cpu: "300m"
      memory: "300Mi"
    limits:
      cpu: "600m"
      memory: "600Mi"
  db:
    port: 3306
    name: "appdb_qa"
  aws:
    secretName: "poc2/mysql-credentials"

database:
  enabled: true
  image:
    repository: mysql
    tag: "8.0"
    pullPolicy: IfNotPresent
  service:
    port: 3306
  storage:
    storageClassName: efs-sc
    size: 10Gi
  resources:
    requests:
      cpu: "300m"
      memory: "300Mi"
    limits:
      cpu: "600m"
      memory: "600Mi"
  mysql:
    database: "appdb_qa"
  aws:
    secretName: "poc2/mysql-credentials"