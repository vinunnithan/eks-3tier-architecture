global:
  environment: dev

frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: 231733667519.dkr.ecr.eu-west-1.amazonaws.com/poc2-three-tier-frontend
    tag: "v2"
    pullPolicy: IfNotPresent
  service:
    port: 80
    targetPort: 80
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"

backend:
  enabled: true
  replicaCount: 1
  image:
    repository: 231733667519.dkr.ecr.eu-west-1.amazonaws.com/poc2-three-tier-backend
    tag: "v1"
    pullPolicy: IfNotPresent
  service:
    port: 80
    targetPort: 4000
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  db:
    port: 3306
    name: "appdb_dev"
  aws:
    secretName: "poc2/mysql-credentials"

database:
  enabled: true
  image:
    repository: mysql
    tag: "8.0"
    pullPolicy: IfNotPresent
  service:
    port: 3306
  storage:
    storageClassName: efs-sc
    size: 5Gi
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  mysql:
    database: "appdb_dev"
  aws:
    secretName: "poc2/mysql-credentials"